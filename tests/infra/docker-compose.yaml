# Test environment of the frontend: frontend + API on top of the infrastructure of tcc-api.
#
#   cd tests/infra
#   docker compose up -d --build
#   ./smoke-test.sh          # what can be checked without a browser
#   python3 check-urls.py    # all URL settings against each other (CORS, issuer, redirect URIs)
#
# Needs Docker Compose >= 2.20 and the two repositories side by side:
#
#   tcc-api/   tcc-client/
#
# The infrastructure of the API (PostgreSQL x2, Keycloak, Mailpit, pgAdmin, OTel collector,
# Prometheus, Loki, Tempo, Grafana) is not repeated here: it is included from
# ../../../tcc-api/tests/infra/docker-compose.yaml, so it is the same in both projects.
# This file adds `auth-proxy`, `api` and `frontend`.
#
#   Frontend    http://localhost:8080     (open exactly this address, not 127.0.0.1)
#   API         http://localhost:3000     (/health/live, /health/ready)
#   Keycloak    http://auth.tcc.localhost:8081   (admin/admin; users alice, bob, admin; password ChangeMe123!)
#   Mailpit     http://localhost:8025     (mails of the API and of Keycloak)
#   Grafana     http://localhost:5000     Prometheus :9090   pgAdmin :5050
#
# Why `auth.tcc.localhost`: the API checks the token issuer against AUTH_DOMAIN *and* fetches the
# signing keys from there, so the browser and the API container have to reach Keycloak under the
# very same address. Keycloak (dev mode) puts the host name of the request into the issuer.
# `*.localhost` is the own machine for the browser; inside the network `auth-proxy` answers to that
# name on port 8081 and hands the request, host name unchanged, to Keycloak.
#
# The frontend reads its settings from ../../public/config.json (mounted, not baked into the
# image); the same file serves `dx serve` on the host. The API runs on the host instead? Start with
# `--scale api=0` and run it with AUTH_DOMAIN=http://auth.tcc.localhost:8081 (the name has to resolve
# on the host, otherwise add `127.0.0.1 auth.tcc.localhost` to the hosts file).
#
# Stop the infrastructure of the API first if it runs on its own (same container names and ports),
# and do not run `dx serve` (port 8080) at the same time.

name: tcc-test

include:
  - ../../../tcc-api/tests/infra/docker-compose.yaml

services:
  auth-proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - keycloak_net
    depends_on:
      keycloak:
        condition: service_healthy

  api:
    image: tcc-api:test
    ports:
      - "3000:3000"
    extra_hosts:
      - "auth.localhost:host-gateway"
      - "api.localhost:host-gateway"
    environment:
      # The image defaults to production mode; here: development mode (http allowed).
      APP_ENV: development
      ADDR: 0.0.0.0:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres-api:5432/tcc_db
      AUTH_REALM: tcc-realm
      AUTH_DOMAIN: http://auth.localhost
      AUTH_AUDIENCE: http://api.localhost
      ALLOW_ORIGIN: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      EMAIL_SENDER_ADDRESS: no-reply@cook-and-run.local
      # Links in the mails: they have to lead to the frontend.
      TEAM_DEEPLINK_BASE_URL: http://localhost:8080
      ADMIN_TEAM_LINK_BASE_URL: http://localhost:8080/admin
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      RUST_LOG: ${RUST_LOG:-info}
      RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-false}
    networks:
      - keycloak_net
    depends_on:
      postgres-api:
        condition: service_healthy
      auth-proxy:
        condition: service_started
      collector:
        condition: service_started
      mailpit:
        condition: service_started

